name: build-php-windows-source

# Prototype: compile PHP for Windows from source with the security backports,
# for a line php.net no longer builds. The result is uploaded as a workflow
# artifact for inspection and is never published; build-php.yml still ships
# php.net's own Windows zips.

on:
  workflow_dispatch:
    inputs:
      line:
        description: 'PHP line to build'
        default: '8.1'

permissions:
  contents: read

jobs:
  build:
    # php-windows-builder supports the vs16 lines on windows-2022.
    runs-on: windows-2022
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build PHP ${{ inputs.line }} for Windows from source
        run: ./build/build-php-windows.sh "${{ inputs.line }}" windows-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ inputs.line }}-windows-x86_64-source
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
