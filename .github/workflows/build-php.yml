name: build-php

# One run is one build wave: the (PHP line × platform) builds that need doing,
# packaged, verified, and published to the rolling `runtimes` release with a
# regenerated manifest.
#
# "Need doing" is build/plan.py's call: every build is fingerprinted by its
# inputs, and one whose fingerprint matches what is already published is left
# alone. A wave in which nothing upstream or in build/ changed builds nothing,
# so the weekly schedule costs minutes, and users are not told their PHP has a
# new build when nothing in it changed. `force` rebuilds regardless.
#
# What does get built starts from cached downloads rather than the network:
# per platform for the static-php-cli builds, whose sources are the same for
# every line, and per platform and line for Windows. Whole build trees are not
# cached: at ~2.6 GB each, three of them filled the repository's 10 GB and
# evicted everything else.

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'PHP lines to build, comma-separated'
        default: '7.4,8.0,8.1,8.2,8.3,8.4,8.5'
      platforms:
        description: 'Platforms to build, comma-separated'
        default: 'darwin-arm64,darwin-x86_64,linux-x86_64,linux-arm64,windows-x86_64,windows-arm64'
      force:
        description: 'Rebuild even what is unchanged'
        type: boolean
        default: false
  schedule:
    # Weekly on Saturdays at 06:00 UTC, so a new upstream patch reaches users
    # without anyone asking.
    - cron: '0 6 * * 6'

permissions:
  contents: write

env:
  RUNTIMES_TAG: runtimes

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          LINES: ${{ inputs.lines || '7.4,8.0,8.1,8.2,8.3,8.4,8.5' }}
          PLATFORMS: ${{ inputs.platforms || 'darwin-arm64,darwin-x86_64,linux-x86_64,linux-arm64,windows-x86_64,windows-arm64' }}
          FORCE: ${{ inputs.force || false }}
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.RUNTIMES_TAG }}/manifest.json
        run: python3 build/plan.py >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    # Without a name GitHub lists every matrix value, fingerprint included.
    name: build (${{ matrix.line }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # A single broken PHP line must not block the whole wave. The failure is
    # still loud in the run summary — a soft failure nobody notices is how a
    # version silently stops being published.
    continue-on-error: true
    timeout-minutes: 300
    # The build is a bash script on every platform, the Windows runner included.
    defaults:
      run:
        shell: bash
    env:
      # spc's sources are the same for every line, so its builds share one
      # download cache per platform; Windows downloads are per line. The key
      # also carries spc-patches.sh, whose darwin layer leaves its own rebuilt
      # archives among the downloads.
      DOWNLOADS_SCOPE: ${{ startsWith(matrix.platform, 'windows-') && format('{0}-{1}', matrix.platform, matrix.line) || matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore downloads
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: .pv-downloads
          key: downloads-${{ env.DOWNLOADS_SCOPE }}-${{ hashFiles('build/spc-patches.sh') }}-${{ github.run_id }}
          restore-keys: |
            downloads-${{ env.DOWNLOADS_SCOPE }}-${{ hashFiles('build/spc-patches.sh') }}-

      - name: Build PHP ${{ matrix.line }} for ${{ matrix.platform }}
        env:
          # spc resolves several sources through the GitHub API; without a
          # token, parallel matrix jobs share one IP and hit the 60/hr limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release the wave was planned for, so the build and the
          # fingerprint recorded for it agree.
          PV_PHP_VERSION: ${{ matrix.version }}
        run: |
          # $PWD rather than github.workspace: on Windows that is a
          # backslashed path, which bash does not take.
          PV_DOWNLOAD_CACHE="$PWD/.pv-downloads" ./build/build-php.sh "${{ matrix.line }}" "${{ matrix.platform }}"

      - name: Record the build's inputs
        run: |
          for tarball in dist/php-*.tar.gz; do
            echo "${{ matrix.inputs }}" > "${tarball}.inputs"
          done

      # Only when the downloads differ from what was restored: the save is
      # keyed by content, so matrix jobs that end with the same downloads
      # share one cache entry instead of each writing their own.
      - name: Save downloads
        if: always() && steps.downloads.outputs.cache-matched-key != format('downloads-{0}-{1}-{2}', env.DOWNLOADS_SCOPE, hashFiles('build/spc-patches.sh'), hashFiles('.pv-downloads/**', '!.pv-downloads/.lock.json', '!.pv-downloads/.used'))
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .pv-downloads
          key: downloads-${{ env.DOWNLOADS_SCOPE }}-${{ hashFiles('build/spc-patches.sh') }}-${{ hashFiles('.pv-downloads/**', '!.pv-downloads/.lock.json', '!.pv-downloads/.used') }}

      - name: Summarize
        if: always()
        run: |
          if ls dist/php-*.tar.gz >/dev/null 2>&1; then
            echo "- ok **${{ matrix.line }} / ${{ matrix.platform }}**: $(ls dist/php-*.tar.gz | xargs -n1 basename | paste -sd' ' -)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **FAILED** ${{ matrix.line }} / ${{ matrix.platform }} — nothing published for it this wave" >> "$GITHUB_STEP_SUMMARY"
          fi

      # spc runs build commands, the post-extract php-src hook among them, with
      # their output going to its own logs rather than the job's. A binary
      # that built but fails spc's sanity check is kept too, to run under a
      # debugger.
      - name: Keep spc's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spc-logs-${{ matrix.line }}-${{ matrix.platform }}
          path: |
            .spc-cache/${{ matrix.line }}-${{ matrix.platform }}/log/
            .spc-cache/${{ matrix.line }}-${{ matrix.platform }}/buildroot/bin/php
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.line }}-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.build
            dist/*.tar.gz.inputs
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # One publish at a time across runs: each merges into the manifest it
    # downloads, so two at once would each drop what the other added.
    concurrency:
      group: publish-runtimes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - run: |
          mkdir -p dist
          find incoming -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.build' -o -name '*.inputs' \) -exec cp {} dist/ \;
          ls -l dist

      - name: Ensure the rolling release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RUNTIMES_TAG" >/dev/null 2>&1 || \
            gh release create "$RUNTIMES_TAG" \
              --title "PHP runtimes" \
              --notes "Prebuilt PHP runtimes installed by pv. The manifest here is what \`pv install\` reads." \
              --latest=false

      # Merge into the published manifest rather than replacing it: a wave that
      # rebuilt only some versions must not unpublish the rest.
      #
      # "Could not download it" and "there is nothing to download yet" must be
      # told apart before deciding to start from nothing — a transient API
      # error that reads as the latter would quietly unpublish every version
      # this wave did not touch. The release's asset list is the arbiter.
      - name: Generate the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download "$RUNTIMES_TAG" --pattern manifest.json --dir previous; then
            merge=(--merge previous/manifest.json)
          elif gh release view "$RUNTIMES_TAG" --json assets \
                 --jq '.assets[].name' | grep -qx manifest.json; then
            echo "error: the release has a manifest.json but it could not be downloaded" >&2
            exit 1
          else
            echo "note: no manifest published yet — bootstrapping one"
            merge=(--allow-empty)
          fi
          ./build/gen-manifest.py \
            --dist dist \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RUNTIMES_TAG}" \
            "${merge[@]}" \
            --out dist/manifest.json
          cat dist/manifest.json

      - name: Upload artifacts and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Assets first, manifest last: a client that fetches the manifest
          # mid-publish should never be pointed at an asset that is not there.
          shopt -s nullglob
          for asset in dist/*.tar.gz dist/*.tar.gz.sha256; do
            gh release upload "$RUNTIMES_TAG" "$asset" --clobber
          done
          gh release upload "$RUNTIMES_TAG" dist/manifest.json --clobber
