name: release-pv

# Cut a pv release: build the client for every platform, publish the tarballs,
# and add them to the runtime manifest's `pv` section so `pv self update` can
# find them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish'
        required: true

permissions:
  contents: write

env:
  RUNTIMES_TAG: runtimes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: darwin-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          # The gnu target links against nothing but DLLs Windows ships, so
          # pv.exe stays a single file with no runtime to install beside it.
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-gnu
            exe: .exe
    runs-on: ${{ matrix.runner }}
    # A retired or unavailable runner label never gets assigned, and the
    # default six-hour timeout would hold the publish job behind it. Fail in
    # one hour instead: the other platforms still publish, because fail-fast
    # is off.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # musl on Linux keeps the client a genuinely dependency-free binary: no
      # glibc floor, so it runs on distributions older than the runner.
      - if: startsWith(matrix.target, 'x86_64-unknown-linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: startsWith(matrix.target, 'aarch64-unknown-linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo test --release --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        # bash everywhere, so the Windows runner packages with the same script.
        shell: bash
        run: |
          # The Windows runner has sha256sum but not shasum. `type -P` asks for
          # a file on PATH: `command -v` would find this function and recurse.
          shasum() { if type -P shasum >/dev/null; then command shasum "$@"; else shift 2; sha256sum "$@"; fi; }
          # From cargo itself rather than a JSON parser: a Windows runner's
          # python3 can be a Store placeholder that runs nothing.
          id="$(cargo pkgid)"
          version="${id##*[#@]}"
          root="pv-${version}-${{ matrix.platform }}"
          # The same shape as a PHP artifact: one top-level directory holding
          # bin/, because pv extracts with the first component stripped.
          mkdir -p "stage/${root}/bin"
          cp "target/${{ matrix.target }}/release/pv${{ matrix.exe }}" "stage/${root}/bin/pv${{ matrix.exe }}"
          mkdir -p dist
          tar -czf "dist/${root}.tar.gz" -C stage "${root}"
          (cd dist && shasum -a 256 "${root}.tar.gz" > "${root}.tar.gz.sha256")
          # An unversioned copy alongside the versioned one, so install.sh can
          # fetch through the releases/latest redirect without discovering the
          # current version first — which would mean parsing JSON in POSIX sh,
          # on a machine that does not have pv yet.
          cp "dist/${root}.tar.gz" "dist/pv-${{ matrix.platform }}.tar.gz"
          (cd dist && shasum -a 256 "pv-${{ matrix.platform }}.tar.gz" \
              > "pv-${{ matrix.platform }}.tar.gz.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pv-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - run: |
          mkdir -p dist
          find incoming -type f -exec cp {} dist/ \;
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          for asset in dist/*; do
            gh release upload "$TAG" "$asset" --clobber
          done

      # The manifest lives with the runtimes and is only ever merged into, so
      # adding pv builds cannot disturb the published PHP entries.
      - name: Add these builds to the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$RUNTIMES_TAG" >/dev/null 2>&1 || \
            gh release create "$RUNTIMES_TAG" --title "PHP runtimes" \
              --notes "Prebuilt PHP runtimes installed by pv." --latest=false
          # Same rule as a build wave: only a manifest that is genuinely absent
          # justifies starting from nothing. A failed download here would drop
          # every published PHP entry.
          if gh release download "$RUNTIMES_TAG" --pattern manifest.json --dir previous; then
            merge=(--merge previous/manifest.json)
          elif gh release view "$RUNTIMES_TAG" --json assets \
                 --jq '.assets[].name' | grep -qx manifest.json; then
            echo "error: the release has a manifest.json but it could not be downloaded" >&2
            exit 1
          else
            echo "note: no manifest published yet — bootstrapping one"
            merge=(--allow-empty)
          fi
          ./build/gen-manifest.py \
            --dist dist \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            "${merge[@]}" \
            --out manifest.json
          gh release upload "$RUNTIMES_TAG" manifest.json --clobber
